name: Build and Deploy via Argo CD (GitOps)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Convert repo owner to lowercase (Docker requirement)
      - name: Set lowercase image owner
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      # 3️⃣ Login to GitHub Container Registry
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ steps.vars.outputs.owner }}/argocd-website:${{ github.sha }}
          docker build -t $IMAGE app
          docker tag $IMAGE ghcr.io/${{ steps.vars.outputs.owner }}/argocd-website:latest

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ steps.vars.outputs.owner }}/argocd-website:${{ github.sha }}
          docker push ghcr.io/${{ steps.vars.outputs.owner }}/argocd-website:latest

      # 6️⃣ Update deployment.yaml with new image tag
      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image:.*|image: ghcr.io/${{ steps.vars.outputs.owner }}/argocd-website:${{ github.sha }}|" deployment.yaml

      # 7️⃣ Commit and push manifest change
      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deployment.yaml
          git commit -m "ci: update image to ${{ github.sha }}"
          git push
