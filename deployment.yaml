apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-website
  labels:
    app: argocd-website
spec:
  replicas: 5
  selector:
    matchLabels:
      app: argocd-website
  template:
    metadata:
      labels:
        app: argocd-website
    spec:
      containers:
        - name: nginx
          image: ghcr.io/moiz-ali-moomin/argocd-website:bfa525edb77de377c2e4827c5514b9a9f6219de0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
