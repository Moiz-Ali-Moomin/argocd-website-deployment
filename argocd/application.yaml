apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-website
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Moiz-Ali-Moomin/argocd-website-deployment.git
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
