worker_processes auto;
pid /tmp/nginx.pid;

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Health check endpoint for liveness probe
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }
    }
}
