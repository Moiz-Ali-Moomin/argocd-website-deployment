apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-website-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-website-rolebinding
subjects:
- kind: ServiceAccount
  name: argocd-website-sa
roleRef:
  kind: Role
  name: argocd-website-role
  apiGroup: rbac.authorization.k8s.io
